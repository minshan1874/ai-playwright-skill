name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────
  # 单元测试：零依赖，秒级完成，覆盖解析 / 配置 / 门禁 / 报告 / 定位器
  # ───────────────────────────────────────────────────────────────────
  unit:
    name: 单元测试 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行单元测试
        run: npm test

  # ───────────────────────────────────────────────────────────────────
  # 离线全链路：装依赖 → 装浏览器 → 起本地演示站 → 解析 / 计划 /
  # 确认 / 探索 / 执行 / 报告。
  #
  # demo.mjs 会断言结果必须恰好是 3 通过 / 1 失败 / 1 未自动化，
  # 否则以非零退出码结束。
  #
  # 这个 job 跑在干净机器上，因此它同时验证了「首次使用者能否自动装好环境」
  # —— 这正是本地开发（浏览器已缓存）覆盖不到的场景。
  # ───────────────────────────────────────────────────────────────────
  demo:
    name: 离线全链路演示 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # 运行目录放进工作区，便于收集产物
      PLAYWRIGHT_E2E_HOME: ${{ github.workspace }}/.e2e-ci
      # 把浏览器装到工作区内的固定路径：缓存 key 只依赖版本，且不跨平台串味
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # actions/cache 在路径不存在时会报错，所以先建出来
      - name: 准备浏览器目录
        run: mkdir -p .pw-browsers

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ runner.arch }}-1.63.0

      - name: 环境自检
        run: node skill/scripts/bootstrap.mjs --check --json

      - name: 跑通全链路
        run: node skill/scripts/demo.mjs --json

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-report-${{ matrix.os }}
          path: |
            .e2e-ci/runs/*/report.md
            .e2e-ci/runs/*/results-summary.json
            .e2e-ci/runs/*/explore/outline.md
            .e2e-ci/runs/*/playwright-report/
          if-no-files-found: warn
          retention-days: 7
