<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playwright E2E 演示站</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f5f6f8;
        color: #1f2328;
      }
      header {
        display: flex; align-items: center; gap: 16px;
        padding: 12px 24px; background: #fff; border-bottom: 1px solid #e3e6ea;
      }
      header h1 { font-size: 16px; margin: 0; }
      header nav { display: flex; gap: 12px; margin-left: auto; }
      header nav a { color: #0969da; text-decoration: none; font-size: 14px; }
      main { max-width: 720px; margin: 32px auto; padding: 0 24px; }
      .card {
        background: #fff; border: 1px solid #e3e6ea; border-radius: 8px;
        padding: 24px; margin-bottom: 16px;
      }
      h2 { font-size: 20px; margin: 0 0 16px; }
      label { display: block; font-size: 13px; color: #57606a; margin-bottom: 4px; }
      input {
        width: 100%; padding: 8px 10px; font-size: 14px;
        border: 1px solid #d0d7de; border-radius: 6px; margin-bottom: 14px;
      }
      button {
        padding: 8px 16px; font-size: 14px; border-radius: 6px;
        border: 1px solid #1f883d; background: #1f883d; color: #fff; cursor: pointer;
      }
      button.secondary { background: #fff; color: #1f2328; border-color: #d0d7de; }
      .error { color: #cf222e; font-size: 13px; margin-top: 12px; }
      .hint { color: #57606a; font-size: 13px; }
      ul { list-style: none; padding: 0; margin: 16px 0 0; }
      li {
        padding: 10px 12px; border: 1px solid #e3e6ea; border-radius: 6px;
        margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
      }
      li span.price { margin-left: auto; color: #57606a; }
      .cart { font-size: 14px; }
      .cart strong { color: #0969da; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <header>
      <h1>Playwright E2E 演示站</h1>
      <nav>
        <a href="#/login" data-testid="nav-login">登录</a>
        <a href="#/search" data-testid="nav-search">商品搜索</a>
        <span class="cart">购物车：<strong data-testid="cart-count">0</strong></span>
      </nav>
    </header>
    <main id="app" data-testid="app"></main>

    <script>
      // A deliberately tiny SPA with hash routing. Everything is in-memory except
      // the cart count, which persists in localStorage so a reload can be tested.
      const PRODUCTS = [
        { id: 'SKU-001', name: '无线蓝牙耳机', price: '¥299.00' },
        { id: 'SKU-002', name: '机械键盘', price: '¥459.00' },
        { id: 'SKU-003', name: '入耳式耳机 Pro', price: '¥599.00' },
        { id: 'SKU-004', name: '显示器支架', price: '¥129.00' },
      ];

      const state = {
        user: sessionStorage.getItem('demo-user') || '',
        cart: Number(localStorage.getItem('demo-cart') || '0'),
        keyword: '',
        searchResults: null,
      };

      const app = document.getElementById('app');

      function saveCart() {
        localStorage.setItem('demo-cart', String(state.cart));
        renderCartCount();
      }

      function renderCartCount() {
        document.querySelector('[data-testid="cart-count"]').textContent = String(state.cart);
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );
      }

      // --- Views ---------------------------------------------------------------

      function renderLogin() {
        app.innerHTML = `
          <section class="card">
            <h2>登录</h2>
            <label for="username">用户名</label>
            <input id="username" name="username" type="text" data-testid="username" autocomplete="username" />
            <label for="password">密码</label>
            <input id="password" name="password" type="password" data-testid="password" autocomplete="current-password" />
            <button type="button" data-testid="submit-login">登录</button>
            <p class="hint" style="margin-top:12px">演示账号：admin / 123456</p>
            <p class="error" data-testid="login-error" hidden></p>
          </section>`;

        const username = app.querySelector('#username');
        const password = app.querySelector('#password');
        const error = app.querySelector('[data-testid="login-error"]');

        app.querySelector('[data-testid="submit-login"]').addEventListener('click', () => {
          error.hidden = true;

          if (username.value.trim() === '') {
            error.textContent = '用户名不能为空';
            error.hidden = false;
            return;
          }
          if (username.value === 'admin' && password.value === '123456') {
            state.user = 'admin';
            sessionStorage.setItem('demo-user', state.user);
            location.hash = '#/dashboard';
            return;
          }
          error.textContent = '用户名或密码错误';
          error.hidden = false;
        });
      }

      function renderDashboard() {
        if (state.user === '') {
          location.hash = '#/login';
          return;
        }
        app.innerHTML = `
          <section class="card">
            <h2>工作台</h2>
            <p>欢迎回来，<span data-testid="current-user">${escapeHtml(state.user)}</span></p>
            <p class="hint">当前角色：管理员</p>
            <p><a href="#/search">前往商品搜索</a></p>
          </section>`;
      }

      function renderSearch() {
        const rows = state.searchResults;
        app.innerHTML = `
          <section class="card">
            <h2>商品搜索</h2>
            <label for="keyword">关键字</label>
            <input id="keyword" name="keyword" type="search" data-testid="keyword" value="${escapeHtml(state.keyword)}" />
            <button type="button" data-testid="submit-search">搜索</button>
          </section>
          <section class="card" data-testid="results-card" ${rows === null ? 'hidden' : ''}>
            <h2>搜索结果</h2>
            <p class="hint" data-testid="result-summary"></p>
            <ul data-testid="product-list"></ul>
            <p class="hint" data-testid="empty-state" hidden>没有找到相关商品</p>
          </section>`;

        const keyword = app.querySelector('#keyword');
        app.querySelector('[data-testid="submit-search"]').addEventListener('click', () => {
          state.keyword = keyword.value.trim();
          state.searchResults = PRODUCTS.filter((product) => product.name.includes(state.keyword));
          render();
        });

        if (rows !== null) {
          app.querySelector('[data-testid="result-summary"]').textContent = `共 ${rows.length} 条结果`;
          const list = app.querySelector('[data-testid="product-list"]');
          list.innerHTML = rows
            .map(
              (product) => `
              <li data-testid="product-row" data-sku="${product.id}">
                <span data-testid="product-name">${escapeHtml(product.name)}</span>
                <span class="price">${escapeHtml(product.price)}</span>
                <button type="button" class="secondary" data-testid="add-to-cart" data-sku="${product.id}">加入购物车</button>
              </li>`,
            )
            .join('');

          app.querySelector('[data-testid="empty-state"]').hidden = rows.length > 0;

          for (const button of list.querySelectorAll('[data-testid="add-to-cart"]')) {
            button.addEventListener('click', () => {
              // Intentional defect kept for the demo: the count resets to 1
              // instead of incrementing, so the cart case fails on purpose.
              state.cart = 1;
              saveCart();
            });
          }
        }
      }

      function renderOrder() {
        app.innerHTML = `
          <section class="card">
            <h2>订单提交成功</h2>
            <p>订单号：<span data-testid="order-id">SO-20250101-0001</span></p>
            <p class="hint">收货地址：默认地址</p>
          </section>`;
      }

      const ROUTES = {
        '#/login': renderLogin,
        '#/dashboard': renderDashboard,
        '#/search': renderSearch,
        '#/order': renderOrder,
      };

      function render() {
        renderCartCount();
        const route = ROUTES[location.hash] || (state.user === '' ? renderLogin : renderDashboard);
        route();
      }

      window.addEventListener('hashchange', render);
      if (location.hash === '') location.hash = state.user === '' ? '#/login' : '#/dashboard';
      render();
    </script>
  </body>
</html>
