name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明**要解决的场景**，再说具体方案 —— 场景清楚时方案往往有更好的选择。

        另外请先看一眼 README 的「不做什么」：单元测试、接口测试、性能压测、
        视觉回归、CI 平台对接都不在本 skill 范围内。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述实际场景，不要直接跳到方案
      placeholder: |
        我们团队的用例表里有「所属需求」这一列，现在解析时被忽略了……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望怎么解决
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 目前你是怎么绕过这个问题的？
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 用例解析（Excel / CSV / Markdown）
        - 测试计划与确认门禁
        - 页面探索与定位器
        - 用例固化（spec 编写）
        - 执行与结果归一化
        - 报告格式
        - 环境安装与依赖
        - 安装脚本与文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
        - label: 我愿意提供测试用例或真实场景样例
          required: false
